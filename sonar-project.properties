# SonarQube Configuration for Voice Assistant AI Project
sonar.projectKey=voice-assistant-ai
sonar.projectName=Voice Assistant AI
sonar.projectVersion=1.0.0
sonar.organization=voice-assistant-ai-org

# Source code configuration
sonar.sources=frontend/src,backend/lambda_functions,backend/shared,infra/terraform
sonar.tests=frontend/src/__tests__,backend/lambda_functions/tests

# Language-specific settings
sonar.python.version=3.9
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info

# Coverage and test reports
sonar.coverage.jacoco.xmlReportPaths=backend/coverage/coverage.xml
sonar.python.coverage.reportPaths=backend/coverage/coverage.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/terraform/.terraform/**,**/terraform/terraform.tfstate**,**/terraform/terraform.tfstate.backup**,**/*.min.js,**/*.bundle.js,**/vendor/**,**/venv/**,**/env/**,**/.env/**,**/__pycache__/**,**/*.pyc,**/migrations/**,**/static/**,**/media/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/terraform/.terraform/**,**/terraform/terraform.tfstate**,**/terraform/terraform.tfstate.backup**

# Duplication settings
sonar.cpd.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/terraform/.terraform/**,**/terraform/terraform.tfstate**,**/terraform/terraform.tfstate.backup**

# Security settings
sonar.security.hotspots.reviewed=true

# Quality gate
sonar.qualitygate.wait=true

# Additional settings
sonar.sourceEncoding=UTF-8
sonar.import_unknown_files=true

# File suffixes
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx
sonar.python.file.suffixes=.py
sonar.terraform.file.suffixes=.tf